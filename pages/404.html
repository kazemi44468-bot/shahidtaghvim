<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2A9D8F"><meta name="description" content="صفحه موردنظر در تقویم شهدا پیدا نشد."><title>۴۰۴ | تقویم شهدا</title><link rel="icon" href="../assets/images/logo.png"><link rel="stylesheet" href="../assets/css/calendar.css"><link rel="stylesheet" href="../assets/css/calendar-shell.css"><style>.not-found-page{min-height:calc(100vh - 180px);display:flex;align-items:center;justify-content:center;padding:60px 20px}.not-found-card{position:relative;width:min(760px,100%);padding:58px 32px;text-align:center;border:1px solid rgba(42,157,143,.22);border-radius:28px;background:rgba(255,255,255,.92);box-shadow:0 18px 55px rgba(20,70,65,.1);overflow:hidden}.not-found-card:before{content:"";position:absolute;inset:0;background:url("../assets/images/024-pattern.png") center/260px repeat;opacity:.07;pointer-events:none}.not-found-card>*{position:relative}.not-found-mark{display:inline-flex;align-items:center;justify-content:center;width:150px;height:150px;margin-bottom:22px;border:1px solid rgba(42,157,143,.3);border-radius:50%;font-size:48px;font-weight:900;color:#237f75;background:rgba(42,157,143,.07);box-shadow:0 0 0 12px rgba(42,157,143,.035)}.not-found-card h1{margin:0 0 14px;font-size:clamp(25px,4vw,36px);color:#173b39}.not-found-card p{max-width:560px;margin:0 auto 28px;line-height:2;color:#607572;font-size:16px}.not-found-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.not-found-actions a{display:inline-flex;align-items:center;justify-content:center;min-width:150px;padding:12px 22px;border-radius:12px;text-decoration:none;font-weight:700;transition:.2s}.not-found-home{color:#fff;background:#2A9D8F;box-shadow:0 8px 20px rgba(42,157,143,.2)}.not-found-calendar{color:#246b65;border:1px solid rgba(42,157,143,.28);background:#fff}.not-found-actions a:hover{transform:translateY(-2px)}@media(max-width:600px){.not-found-page{padding:30px 14px}.not-found-card{padding:42px 20px}.not-found-mark{width:125px;height:125px;font-size:40px}.not-found-card p{font-size:14px}.not-found-actions a{width:100%}}</style></head><body><div id="calendarShellHeader"></div><main class="not-found-page"><section class="not-found-card" aria-labelledby="not-found-title"><div class="not-found-mark" aria-hidden="true">۴۰۴</div><h1 id="not-found-title">صفحه موردنظر پیدا نشد</h1><p>این نشانی در تقویم شهدا وجود ندارد یا ممکن است صفحه جابه‌جا شده باشد. از مسیرهای زیر می‌توانید به بخش‌های اصلی تقویم برگردید.</p><div class="not-found-actions"><a class="not-found-home" href="../index.html">بازگشت به صفحه نخست</a><a class="not-found-calendar" href="calendar.html">مشاهده تقویم</a></div></section></main><div id="calendarShellFooter"></div><script src="../assets/js/calendar-shell.js"></script></body></html>
